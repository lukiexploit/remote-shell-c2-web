<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LukiLab - login</title>
<style>
:root { --red: #e74c3c; --red-b: #ff4444; --red-d: #8b0000; --bg: #0d0d0d; --surface: #1a1a1a; --border: #2a2a2a; --text: #e0e0e0; --dim: #666; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
pre {
  font-family: 'Consolas', 'Courier New', monospace;
  line-height: 1.3;
}
.card {
  border: 1px solid var(--border);
  padding: 40px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  background: var(--surface);
}
.logo { margin-bottom: 24px; }
.logo pre { color: var(--red); font-size: 11px; }
.sub { color: var(--dim); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
.field { margin-bottom: 16px; text-align: left; }
.field label { display: block; font-size: 11px; margin-bottom: 4px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
input[type=password] {
  width: 100%; padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Consolas', monospace;
  font-size: 14px;
  outline: none;
  transition: border .2s;
}
input[type=password]:focus { border-color: var(--red); }
.btn {
  width: 100%; padding: 10px;
  background: var(--red);
  border: none;
  color: #fff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: background .2s;
}
.btn:hover { background: var(--red-b); }
.error { color: var(--red-b); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
<div class="logo">
<pre>
  _      _ _    _ ____  _
 | |    | | |  | |  _ \| |
 | |    | | |  | | |_) | | __ _ ___
 | |    | | |  | |  _ &lt;| |/ _` / __|
 | |____| | |__| | |_) | | (_| \__ \
 |______|_|\____/|____/|_|\__,_|___/
</pre>
<div class="sub">control panel</div>
</div>
<form method="POST">
<div class="field">
<label>password</label>
<input type="password" name="password" autofocus>
</div>
<button class="btn" type="submit">enter</button>
</form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
</body>
</html>
